/* ---------- Actions ---------- */
function todayKey(){return key(today())}
/* ---------- A day in the calendar: everything that day as a to-do list you can edit ---------- */
const dayDone=(h,d,dk)=>h.period==='daily'?isFinished(h,d):(isFinished(h,d)||val(h,dk)>0);
function dayStatus(h,d,dk){
  const v=val(h,dk),p=progress(h,d),per={weekly:'this week',monthly:'this month'}[h.period];
  if(isSkipped(h,d))return `Skipped${per?' '+per:' for the day'}`;
  if(h.kind==='amount'){
    const base=`${fmt(p)} of ${fmt(h.goal)} ${esc(h.unit)}`;
    return h.period==='daily'?base+(need(h)<h.goal?` \u00b7 min ${esc(minLabel(h))}`:''):`${base} ${per}`;
  }
  if(h.period==='daily')return v>=1?'Done':v>0?'Minimum done':'Not done';
  return v>0?`Done \u00b7 ${per}`:isFinished(h,d)?`Done earlier ${per}`:`Not done ${per}`;
}
/* what the big check does for each kind of habit */
function dayToggle(h,dk){
  const d=parse(dk),v=val(h,dk);
  if(h.kind==='binary')return setAmount(h,dk,nextBinary(h,v,true));   // none, done, minimum (when it has one)
  if(h.period==='daily')return setAmount(h,dk,v>=h.goal?0:h.goal);
  if(v>0)return setAmount(h,dk,0);
  const rest=h.goal-(progress(h,d)-v);return setAmount(h,dk,rest>0?rest:(h.step||1));
}
function dayRow(h,d,dk){
  const v=val(h,dk),sk=isSkipped(h,d),done=dayDone(h,d,dk),amount=h.kind==='amount';
  const full=h.period==='daily'?isFinished(h,d):v>0;
  const half=!full&&((h.kind==='binary'&&h.period==='daily'&&v>0)||(amount&&h.period==='daily'&&isMet(h,d)&&!isFinished(h,d)));
  const per={daily:'day',weekly:'week',monthly:'month'}[h.period],u=amount?esc(h.unit||'units'):'';
  const stepper=amount?`<div class="dstep"><button data-a="dayStep" data-id="${h.id}" data-dir="-1" aria-label="One less ${u} for ${esc(h.name)}">${icon('minus',16,2.4)}</button><input class="dnum" inputmode="decimal" data-id="${h.id}" value="${fmt(v)}" aria-label="${u} for ${esc(h.name)} on this day"><button data-a="dayStep" data-id="${h.id}" data-dir="1" aria-label="One more ${u} for ${esc(h.name)}">${icon('plus',16,2.4)}</button></div>`:'';
  const links=[];
  if(sk)links.push(`<button class="dlink" data-a="daySkip" data-id="${h.id}">Undo skip</button>`);
  else{
    if(!isMet(h,d))links.push(`<button class="dlink" data-a="daySkip" data-id="${h.id}">Skip this ${per}</button>`);
    if(amount&&need(h)<h.goal&&isMet(h,d)&&progress(h,d)<h.goal)links.push(`<button class="dlink" data-a="dayClaim" data-id="${h.id}">${isSettled(h,d)?'Counted \u00b7 Undo':'Count as done'}</button>`);
  }

    <div class="dinfo"><div class="dname">${esc(h.name)}</div><div class="dstat">${dayStatus(h,d,dk)}</div>${links.length?`<div class="dlinks">${links.join('')}</div>`:''}</div>${stepper}</div>`;
}
function dayPanel(){

  s.err='';if(el)el.textContent='';
  Object.assign(h,r.f);save();renderMain();
}
function liveSoon(){livePending=true;clearTimeout(liveT);liveT=setTimeout(liveApply,200)}
const t0=()=>today();
function act(a,ds,e){
  const h=ds.id?byId(ds.id):null,tk=todayKey();
  switch(a){
    case 'sheetToggle':snapSheet(S.sheetP?0:1);break;
    case 'tab':if(ds.t==='today'&&S.tab!=='today'){pickQuote();S.sheetP=0}S.tab=ds.t;S.resetScroll=true;render();break;
    case 'open':openForm('edit',h,{dk:tk,from:'today'});break;
    case 'add':change(h,tk,()=>setAmount(h,tk,val(h,tk)+h.step));break;
    case 'skip':{
      if(!h||isMet(h,today()))break;
      const ready0=celebrationReady(),cyc0=cycleState();
      setSkip(h,today(),true);if(S.hold===h.id)S.hold=null;
      if(S.tab==='today'&&!ready0&&celebrationReady()&&!reduced()&&!!document.createElement)beginParty();
      else if(S.partyHold&&!celebrationReady())endParty();
      cycleCheck(cyc0);
      const perT={daily:'today',weekly:'this week',monthly:'this month'}[h.period];
      render();buzz(10);
      showToast(`Skipped ${h.name} ${perT}`,()=>{setSkip(h,today(),false);if(S.partyHold&&!celebrationReady())endParty();render()});
      break}
    case 'unskip':{
      if(!h)break;
      setSkip(h,today(),false);if(S.partyHold&&!celebrationReady())endParty();
      render();showToast(`${h.name} is back on your list`);break}
    case 'settle':{
      const ready0=celebrationReady(),cyc0=cycleState(),back=restorePoint(h);
      S.settle[h.id]=S.settle[h.id]||{};S.settle[h.id][settleKey(h,today())]=1;save();
      S.anim={id:h.id,tier:2};setTimeout(()=>{if(S.anim&&S.anim.id===h.id)S.anim=null},950);
      holdThenLeave(h.id);
      if(!ready0&&celebrationReady()&&S.tab==='today'&&!reduced()&&!!document.createElement)beginParty();
      cycleCheck(cyc0,back);
      render();floatText('Win claimed!',2);fxBurst(h.color,18,[2.5,5]);buzz([10,30,12]);
      showToast(`Win claimed: ${h.name}`,back);break}
    case 'unsettle':{if(S.settle[h.id])delete S.settle[h.id][settleKey(h,today())];save();if(S.partyHold&&!celebrationReady())endParty();render();break}
    case 'minmark':{const v1=val(h,tk);change(h,tk,()=>setAmount(h,tk,v1>0?0:0.5));break}
    case 'toggle':{
      const v0=val(h,tk);
      if(h.period!=='daily'&&v0===0&&progress(h,t0())>=h.goal){
        const a0=periodRange(h,t0())[0];let k=null;
        for(let x=t0();x>=a0;x=addDays(x,-1)){if(val(h,key(x))>0){k=key(x);break}}
        if(k){setAmount(h,k,0);render()}
        break;
      }
      change(h,tk,()=>setAmount(h,tk,nextBinary(h,v0)));break}
    case 'reset':{const prev=val(h,tk);setAmount(h,tk,0);render();showToast(`Reset ${h.name} for today`,()=>{setAmount(h,tk,prev);render()});break}
    case 'undo':if(S.toast){const f=S.toast;S.toast=null;$('#toast').innerHTML='';f()}break;
    case 'newHabit':openForm('new');break;
    case 'step':{const s=S.sheet,hh=byId(s.id);change(hh,s.dk,()=>setAmount(hh,s.dk,val(hh,s.dk)+(+ds.d)*hh.step));break}
    case 'fillmin':{const s=S.sheet,hh=byId(s.id);change(hh,s.dk,()=>setAmount(hh,s.dk,Math.max(val(hh,s.dk),need(hh))));break}
    case 'fill':{const s=S.sheet,hh=byId(s.id);change(hh,s.dk,()=>setAmount(hh,s.dk,hh.goal));break}
    case 'closeSheet':closeSheet();break;
    case 'popcolor':S.sheet.draft.color=ds.v;renderIconPop();renderSheetBody();if(S.sheet.mode==='edit')liveApply();break;
    case 'toggleDone':S.showDone=!S.showDone;render();break;
    case 'habPop':openHabPop();break;
    case 'habPick':S.cal.id=ds.id;closeIconPop();render();break;
    case 'iconPop':openIconPop();break;
    case 'amtAdd':case 'amtSub':{
      const inp=document.querySelector('#amt-input'),er=document.querySelector('#amt-err');
      const h2=S.amt&&byId(S.amt.id);if(!h2){closeIconPop();break}
      const tk2=todayKey(),raw=String(inp?inp.value:'').trim();
      if(raw===''){
        S.fxRect=S.amt.rect;closeIconPop();
        if(a==='amtSub')change(h2,tk2,()=>adjustPeriod(h2,tk2,-progress(h2,today())));   // reset: back to zero for this day, week or month
        else change(h2,tk2,()=>adjustPeriod(h2,tk2,h2.step||1));                         // empty + add: one normal step
        break;
      }
      let n=parseFloat(raw.replace(',','.'));
      if(h2.kind==='binary')n=Math.round(n);
      if(!(n>0)){if(er){er.textContent='Enter a number above 0';er.className='apcap bad'}break}
      const sign=a==='amtSub'?-1:1;
      S.fxRect=S.amt.rect;closeIconPop();
      change(h2,tk2,()=>adjustPeriod(h2,tk2,sign*n));break}
    case 'closePop':closeIconPop();break;
    case 'pick':S.sheet.pick=S.sheet.pick===ds.k?null:ds.k;renderSheetBody();break;
    case 'fset':fset(ds.k,ds.v);break;
    case 'saveForm':saveForm();break;
    case 'delHabit':{
      if(!S.sheet.confirmDel){S.sheet.confirmDel=true;renderSheetBody();break}
      const id=S.sheet.id;S.habits=S.habits.filter(x=>x.id!==id);delete S.logs[id];delete S.settle[id];delete S.skips[id];if(S.cal.id===id)S.cal.id=null;save();closeSheet();render();break}
    case 'habPrev':case 'habNext':{const i=S.habits.findIndex(x=>x.id===S.cal.id),n=S.habits.length;if(n>1){S.cal.id=S.habits[(i+(a==='habNext'?1:-1)+n)%n].id;render()}break}
    case 'calView':S.cal.view=ds.v;S.resetScroll=true;render();break;
    case 'prev':case 'next':{
      const dir=a==='next'?1:-1;
      if(S.cal.view==='month'){const d=new Date(S.cal.y,S.cal.m+dir,1);S.cal.y=d.getFullYear();S.cal.m=d.getMonth()}
      else S.cal.y+=dir;
      render();break}
    case 'pickMonth':S.cal.view='month';S.cal.m=+ds.m;S.resetScroll=true;render();break;
    case 'pickYear':S.cal.view='year';S.cal.y=+ds.y;S.resetScroll=true;render();break;
    case 'day':S.cal.day=S.cal.day===ds.dk?null:ds.dk;render();if(S.cal.day)scrollToDay();break;   // tap the same date again to fold it away
    case 'dayClose':S.cal.day=null;render();break;
    case 'dayNav':{const nd=addDays(parse(S.cal.day),+ds.dir);if(nd>today())break;S.cal.day=key(nd);render();break}
    case 'dayCheck':{const dk=S.cal.day;change(h,dk,()=>dayToggle(h,dk));break}
    case 'dayStep':{const dk=S.cal.day;change(h,dk,()=>setAmount(h,dk,val(h,dk)+(+ds.dir)*(h.step||1)));break}
    case 'daySkip':{const d=parse(S.cal.day);setSkip(h,d,!isSkipped(h,d));render();break}
    case 'dayClaim':{const d=parse(S.cal.day),k=settleKey(h,d),m=S.settle[h.id]||(S.settle[h.id]={});if(m[k])delete m[k];else m[k]=1;save();render();break}
    case 'goHabit':S.cal.id=ds.id;S.tab='calendar';S.resetScroll=true;render();break;
    case 'settings':openSheet({type:'settings',confirm:null});break;
    case 'clearAll':
      if(S.sheet.confirm!=='clear'){S.sheet.confirm='clear';renderSheetBody();break}
      S.habits=[];S.logs={};S.settle={};S.skips={};S.cal.id=null;save();closeSheet();render();showToast('Everything cleared');break;
  }
}
function wire(){
  const app=$('#app');
  app.addEventListener('click',e=>{
    if(Date.now()<suppressUntil)return;if(longFired){longFired=false;return}
    let el=e.target.closest('[data-a]');if(!el)return;
    if(el.dataset.a==='open'&&e.detail>0&&el.querySelectorAll){   // a real tap on the row: if it was aimed at the + / check or at the minimum win, press that instead
      let best=null,bd=1e9;
      el.querySelectorAll('.act,.mbtn').forEach(b=>{
        const r=b.getBoundingClientRect(),m=b.classList.contains('act')?24:18;
        const dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom);
        if(dx<=m&&dy<=m){const d=Math.hypot(dx,dy);if(d<bd){bd=d;best=b}}
      });
      if(best)el=best;
    }
    S.fxRect=el.getBoundingClientRect();act(el.dataset.a,el.dataset,e);
  });
  setInterval(()=>{checkRollover();refreshScene()},30000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkRollover();refreshScene();pickQuote();if(S.tab==='today'&&!S.sheet&&!iconPopOpen&&!dragging)render()}});
  app.addEventListener('pointerdown',pressStart);
  app.addEventListener('pointerdown',swipeStart);
  document.addEventListener('touchstart',touchStartSheet,{passive:true});
  document.addEventListener('touchmove',touchMoveSheet,{passive:false});
  document.addEventListener('touchend',touchEndSheet);document.addEventListener('touchcancel',touchEndSheet);
  app.addEventListener('wheel',wheelSheet,{passive:false});
  app.addEventListener('selectstart',e=>{const n=e.target&&(e.target.closest?e.target:e.target.parentElement);if(!(n&&n.closest&&n.closest('input,textarea')))e.preventDefault()});
  app.addEventListener('contextmenu',e=>{if(!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault()});
  $('#screen').addEventListener('touchmove',e=>{if(dragging)e.preventDefault()},{passive:false});
  app.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target&&e.target.classList&&e.target.classList.contains('dnum')){e.target.blur();return}
    if(e.key==='Enter'&&e.target.id==='amt-input'){e.preventDefault();act('amtAdd',{});return}
    if(e.key==='Escape'&&iconPopOpen){closeIconPop();return}
    if(e.key==='Escape'&&S.sheet){closeSheet();return}
    if((e.key==='s'||e.key==='S')&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&e.target.classList&&e.target.classList.contains('row')&&e.target.querySelector&&e.target.querySelector('.skipact')){e.preventDefault();act('skip',e.target.dataset,e);return}   // keyboard: S skips the focused habit
    if(e.altKey&&e.target.classList&&e.target.classList.contains('row')&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();moveHabit(e.target.dataset.id,e.key==='ArrowUp'?-1:1);return}
    if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('row')){e.preventDefault();act('open',e.target.dataset,e)}
  });
  app.addEventListener('input',e=>{if(e.target&&e.target.id==='set-name'){S.name=e.target.value.slice(0,24);save();renderMain();return}if(e.target&&e.target.id==='amt-input')syncAmtBtn();const f=e.target.dataset&&e.target.dataset.f;if(f&&S.sheet&&S.sheet.draft){S.sheet.draft[f]=e.target.value;if(S.sheet.mode==='edit')liveSoon()}});
  app.addEventListener('change',e=>{
    if(e.target&&e.target.classList&&e.target.classList.contains('dnum')&&S.cal.day){
      const hh=byId(e.target.dataset.id),dk=S.cal.day,n=parseFloat(String(e.target.value).replace(',','.'));
      if(hh)change(hh,dk,()=>setAmount(hh,dk,isNaN(n)?val(hh,dk):n));return;
    }
    const k=e.target.dataset&&e.target.dataset.k;
    if(k&&S.sheet&&S.sheet.draft){fset(k,e.target.value);return}
    const c=e.target.dataset&&e.target.dataset.c;if(!c)return;
    else if(c==='insRange')S.ins.range=e.target.value;
    else if(c==='calHabit'){S.cal.id=e.target.value}
    render();
  });
}
async function init(){wire();await load();render()}
