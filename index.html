<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habits</title>
<meta name="description" content="A gentle habit tracker with a sloth.">
<meta name="theme-color" content="#EFE4D5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1310" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#EFE4D5; --card:#FFFCF8; --line:#E1D5C4; --ink:#18221C; --muted:#6B5F53; --faint:#A39686; --track:#E7DCCB;
  --g:#00764C; --on-g:#FFFFFF; --warn:#C7692B; --danger:#C2412D;
  --shadow:0 1px 2px rgba(70,50,30,.06),0 6px 18px rgba(70,50,30,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Source Serif 4","Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E1310;--card:#161C18;--line:#243029;--ink:#E8EFE9;--muted:#8D9A92;--faint:#5E6B63;--track:#222B25;
    --g:#5ACA94;--on-g:#07170E;--warn:#E39158;--danger:#E5705D;--shadow:none;color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{position:fixed;inset:0;width:100%;display:flex;justify-content:center;touch-action:none}   /* pinned to the window: it cannot scroll or bounce */
button{font-family:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--g);outline-offset:2px}
svg{display:block}

#app{width:100%;max-width:440px;height:100%;position:relative;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media(min-width:480px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
#screen{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 20px;-webkit-overflow-scrolling:touch}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--bg);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--faint);font:500 12px var(--sans);padding:7px 0;cursor:pointer;border-radius:12px}
.tab.on{color:var(--g)}

#head{flex:none;background:var(--bg);position:relative}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;background:var(--bg)}
h1{font:400 28px/1.1 var(--serif);letter-spacing:-.012em;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.pill{position:relative;display:inline-flex;align-items:center;gap:9px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--ink);max-width:100%}
.pill.tint{background:color-mix(in srgb,var(--c) 12%,var(--card));border-color:color-mix(in srgb,var(--c) 20%,var(--card))}
.pill select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
.pill .pi{color:var(--c);display:grid;place-items:center}
.pill .pn{font:400 17px var(--serif)}
.iconbtn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);cursor:pointer}
.iconbtn:disabled{opacity:.35;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}

/* Today */
.sumcard{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:4px}
.sumcard .ringwrap{width:56px;height:56px}
.sumcard .ringtxt b{font-size:15px}
.sumcard .ringtxt span{display:none}
.ringwrap{position:relative;width:96px;height:96px;flex:none}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringtxt b{font:400 26px/1 var(--serif)}
.ringtxt span{font-size:12px;color:var(--muted);margin-top:3px}
.week{flex:1;display:flex;align-items:flex-end;gap:6px;height:56px;padding-left:14px;border-left:1px solid var(--line)}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.wkbar{width:100%;border-radius:5px;background:color-mix(in srgb,var(--g) 38%,var(--card))}
.wk.now .wkbar{background:var(--g)}
.wk.fut .wkbar{background:var(--track)}
.wk span{font-size:11px;color:var(--muted)}
.wk.now span{color:var(--g);font-weight:600}
.sect{font:600 12.5px var(--sans);color:var(--muted);margin:12px 2px 6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);margin-bottom:6px;cursor:pointer;transition:background .25s,border-color .25s;text-align:left}
.row.done{background:color-mix(in srgb,var(--c) 15%,var(--card));border-color:color-mix(in srgb,var(--c) 30%,var(--card))}
.tile{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 20%,var(--card));color:var(--c)}
.tile.sm{width:34px;height:34px;border-radius:11px}
.rbody{flex:1;min-width:0}
.rname{font:400 16.5px/1.2 var(--serif)}
.rmeta{font-size:12px;color:var(--muted);margin-top:1px}
.bar{height:4px;border-radius:2px;background:var(--track);margin-top:5px;overflow:hidden}
.row.done .bar{background:color-mix(in srgb,var(--c) 14%,var(--card))}
.bar i{display:block;height:100%;border-radius:3px;background:var(--c);transition:width .3s}
.segs{display:flex;gap:4px;margin-top:5px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--track)}
.row.done .segs i{background:color-mix(in srgb,var(--c) 14%,var(--card))}
.segs i.on{background:var(--c)!important}
.rcue{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:4px}
.rcue svg{color:#E6A100;flex:none}
.rcue+.rcue{margin-top:2px}
.act svg{width:18px;height:18px}
.act{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);cursor:pointer}
.act:not(.ok)[data-a="toggle"]{color:var(--faint)}
.act.ok{background:var(--g);border-color:var(--g);color:var(--on-g)}
.act.pop{animation:pop .34s ease-out}
@keyframes pop{0%{transform:scale(.78)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.addbtn{width:100%;margin-top:4px;padding:10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:500 14px var(--sans);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.empty b{display:block;font:400 20px var(--serif);color:var(--ink);margin-bottom:6px}
.empty .primary{width:auto;margin-top:16px;padding:12px 22px}

/* Segmented */
.seg{display:flex;background:var(--track);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:11px;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:500}

/* Calendar */
.nav{display:flex;align-items:center;justify-content:space-between;margin:16px 0 4px}
.nav h2{font:400 24px var(--serif);margin:0}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;color:var(--muted);font-size:12px;margin:12px 0 8px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{aspect-ratio:1/1;border-radius:11px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14px;color:var(--ink);cursor:pointer;padding:0}
.cell svg{color:var(--g)}
.cell.l2 span,.cell.l1 span{font-size:12px}
.cell.out{background:var(--track);color:var(--faint);border-color:transparent;cursor:default;opacity:.6}
.cell.l1{background:color-mix(in srgb,var(--g) 34%,var(--card));border-color:color-mix(in srgb,var(--g) 55%,var(--card))}
.cell.l2{background:var(--g);border-color:var(--g);color:var(--on-g);font-weight:600}
.cell.l2 svg{color:var(--on-g)}
.cell.today{outline:2px solid color-mix(in srgb,var(--ink) 55%,transparent);outline-offset:1px}
.cell.future{color:var(--faint);cursor:default;background:transparent}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:26px}
.stats.s3{grid-template-columns:repeat(3,1fr)}
.stats>div{padding:0 0 0 12px;border-left:1px solid var(--line)}
.stats>div:first-child{padding-left:2px;border-left:0}
.stats b{display:block;font:400 28px/1.1 var(--serif)}
.stats span{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.25}
.stats em{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:1px}
.note{font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.5}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.mini{background:none;border:1px solid transparent;border-radius:12px;padding:8px;text-align:left;cursor:pointer}
.mini.cur{border-color:color-mix(in srgb,var(--g) 45%,var(--card));background:color-mix(in srgb,var(--g) 7%,var(--card))}
.mini .mh{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px;color:var(--ink)}
.mini .mh em{font-style:normal;color:var(--muted)}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.g i{aspect-ratio:1;border-radius:2px;background:var(--track)}
.g i.m2{background:var(--g)}
.g i.m1{background:color-mix(in srgb,var(--g) 55%,var(--card))}
.g i.mf{background:color-mix(in srgb,var(--track) 50%,var(--card))}
.g i.mx{background:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tilecard{display:flex;align-items:center;gap:12px;padding:14px}
.tilecard b{display:block;font:400 24px/1.1 var(--serif)}
.tilecard span{font-size:12px;color:var(--muted)}
.tilecard .ti{color:var(--c);flex:none}
.h3{font:400 20px var(--serif);margin:24px 0 4px}
.yrow{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;cursor:pointer}
.yrow .yh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.yrow .yh b{font:400 20px var(--serif)}
.yrow .yh span{font-size:14px}
.yrow .ys{font-size:12px;color:var(--muted);margin-top:6px;text-align:right}
.strip{width:100%;height:auto}
.strip rect{fill:var(--track)}
.strip .s2{fill:var(--g)}
.strip .s1{fill:color-mix(in srgb,var(--g) 55%,var(--card))}
.strip .s-1{fill:color-mix(in srgb,var(--track) 50%,var(--card))}

/* Insights */
.ringcard{display:flex;align-items:center;gap:18px;padding:16px;margin-bottom:12px}
.ringcard .ringwrap{width:112px;height:112px}
.ringcard .ringtxt b{font-size:30px}
.ringcard .big{font:400 24px var(--serif)}
.ringcard .lab{font-size:14px;color:var(--muted);margin:3px 0 10px}
.delta{display:inline-block;padding:4px 9px;border-radius:8px;background:color-mix(in srgb,var(--g) 14%,var(--card));color:var(--g);font-size:13px;font-weight:600;margin-right:6px}
.delta.neg{background:color-mix(in srgb,var(--warn) 14%,var(--card));color:var(--warn)}
.delta.flat{background:var(--track);color:var(--muted)}
.vs{font-size:13px;color:var(--muted)}
.chartcard{padding:16px 14px 10px;margin-bottom:12px}
.chartcard h3,.perfcard h3,.totcard h3{font:400 20px var(--serif);margin:0 0 8px 2px}
.ax{font:11px var(--sans);fill:var(--muted)}
.gl{stroke:var(--line);stroke-width:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.two .tilecard b{font-size:30px}
.perfcard,.totcard{padding:16px;margin-bottom:12px}
.perf{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:8px 0;cursor:pointer;text-align:left}
.perf .pn{flex:0 0 118px;font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.perf .pb{flex:1;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.perf .pb i{display:block;height:100%;border-radius:4px;background:color-mix(in srgb,var(--g) 70%,var(--card))}
.perf .pp{width:38px;text-align:right;font-size:14px}
.perf svg{color:var(--faint)}
.totcard .stats{margin-top:12px}

/* Sheets */
.scrim{position:absolute;inset:0;background:rgba(8,14,10,.4);z-index:20;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--card);border-radius:26px 26px 0 0;z-index:21;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 6px;flex:none}
.sbody{overflow-y:auto;padding:8px 20px 22px}
@keyframes up{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.stitle{font:400 26px var(--serif);margin:4px 0 16px}
.dhead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.dhead h2{font:400 24px/1.15 var(--serif);margin:0}
.dhead p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.dday{font-size:13px;color:var(--muted);margin-bottom:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:18px;background:color-mix(in srgb,var(--c) 9%,var(--card));border:1px solid color-mix(in srgb,var(--c) 18%,var(--card))}
.stepper .iconbtn{width:46px;height:46px}
.stepper .sv{text-align:center}
.stepper .sv b{display:block;font:400 34px/1 var(--serif)}
.stepper .sv span{font-size:13px;color:var(--muted)}
.bigtoggle{width:100%;padding:16px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);font:500 16px var(--sans);display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer}
.bigtoggle.on{background:var(--g);border-color:var(--g);color:var(--on-g)}
.psum{margin-top:14px;font-size:14px;color:var(--muted)}
.psum b{color:var(--ink);font-weight:600}
.cues{margin-top:18px;display:grid;gap:10px}
.cues div{padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.cues small{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.cues small svg{color:#E6A100}
.cues p{margin:3px 0 0;font-size:15px}
.btnrow{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:500 15px var(--sans);cursor:pointer}
.primary{width:100%;padding:15px;border-radius:14px;background:var(--g);color:var(--on-g);border:0;font:600 16px var(--sans);cursor:pointer}
.linkbtn{display:block;margin:14px auto 0;background:none;border:0;font:500 14px var(--sans);color:var(--muted);padding:8px;cursor:pointer}
.linkbtn.danger{color:var(--danger)}
.field{margin-bottom:16px}
.field label,.flabel{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px var(--sans)}
.field .hint{font-size:12px;color:var(--faint);margin-top:5px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icons{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px}
.icons button{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icons button.on{color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));border-color:var(--c)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.swatches button.on{border-color:var(--card);box-shadow:0 0 0 2px var(--c)}
.err:empty{display:none}
.err{color:var(--danger);font-size:13px;margin:-4px 0 12px}
.setbtn{width:100%;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:15px;margin-bottom:10px;cursor:pointer}
.setbtn small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.setbtn.confirm{border-color:var(--danger);color:var(--danger)}
#toast{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 78px);z-index:40;pointer-events:none}
#toast.up{bottom:calc(env(safe-area-inset-bottom) + 304px);transition:bottom .25s}
.toast{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;animation:up .25s}
.toast button{background:none;border:0;color:inherit;font:600 14px var(--sans);text-decoration:underline;cursor:pointer}

#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.sumcard.gold{background:color-mix(in srgb,#E6A100 10%,var(--card));border-color:color-mix(in srgb,#E6A100 32%,var(--card))}
.sumcard.gold .ringtxt{color:#C98A00}
.streakbox{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:66px;flex:none}
.streakbox svg{color:#F26A3D}
.streakbox b{font:400 24px/1 var(--serif)}
.streakbox span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.streakbox .sr{display:flex;align-items:center;gap:4px}
.row.done.mid{background:color-mix(in srgb,var(--c) 6%,var(--card))}
.minok{display:inline-flex;align-items:center;gap:3px;color:var(--g);font-weight:600;margin-right:5px}
.bar{position:relative}
.bar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--card);border-radius:1px}
.ident{margin:-6px 0 14px;font:italic 400 15px var(--serif);color:var(--muted)}
.btnpair{display:flex;gap:10px;margin-top:10px}

.rcue{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:6px;min-width:0}
.rcue svg{flex:none;color:var(--c)}
.rcue span{overflow-wrap:anywhere}
.minchip{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;font-size:11px;font-weight:600;color:color-mix(in srgb,var(--c) 75%,var(--ink));background:color-mix(in srgb,var(--c) 14%,var(--card));white-space:nowrap}
.why{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;padding:6px 4px 2px;text-align:left;cursor:pointer;color:var(--muted);min-width:0}
.why svg{flex:none;color:var(--c)}
.why span{font:italic 400 14px var(--serif)}
.plan{border:1px solid var(--line);border-radius:16px;margin-bottom:16px;background:var(--bg)}
.plan>div{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:11px 14px;align-items:baseline}
.plan>div+div{border-top:1px solid var(--line)}
.plan small{font-size:12px;color:var(--muted)}
.plan p{margin:0;font-size:15px;line-height:1.4}
.plan p.why-t{font:italic 400 16px/1.35 var(--serif)}
.plan .add{background:none;border:0;padding:0;font:500 14px var(--sans);color:var(--g);cursor:pointer;text-align:left}
.plan .hl{color:color-mix(in srgb,var(--c) 70%,var(--ink));font-weight:600}
.planh{font:400 20px var(--serif);margin:22px 0 4px}
.planp{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.45}

.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* It's an app, not a document: no text selection, loupe or callout anywhere except inside text fields. */
html,body,#app,#app *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app input,#app textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#app ::selection{background:transparent}
#app input::selection{background:color-mix(in srgb,var(--g) 30%,transparent)}
.row.pressing{transform:scale(.985);transition:transform .15s}
.row.drag{z-index:5;scale:1.02;box-shadow:0 12px 30px rgba(0,0,0,.2);border-color:var(--c);transition:none;position:relative}
.tip{text-align:center;font-size:12px;color:var(--faint);margin-top:10px}

.rtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rname{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-width:0}
.rn{min-width:0;max-width:100%;overflow-wrap:anywhere}
.namechk{flex:none;display:grid;color:var(--g)}
.rcount{flex:none;font-size:12.5px;color:var(--muted);white-space:nowrap}
.rwhy{font:italic 400 13px/1.3 var(--serif);color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.rsub{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:6px;min-width:0}
.rsub .rcue{margin-top:0;min-width:0;max-width:100%;flex:0 1 auto}
.rsub .minchip{margin-left:0;flex:none}
.rsub button.minchip{font-family:inherit;line-height:1.35;cursor:pointer;border:1px solid color-mix(in srgb,var(--c) 28%,transparent);text-align:left;-webkit-user-select:none;user-select:none}
.rsub button.minchip.ok{border-color:color-mix(in srgb,var(--g) 40%,transparent)}
.minchip.ok{display:inline-flex;align-items:center;gap:3px;color:var(--g);background:color-mix(in srgb,var(--g) 14%,var(--card))}

.sbody{padding:8px 20px 0}
.sbody::after{content:"";display:block;height:16px}
.sfoot{position:sticky;bottom:0;background:var(--card);padding:10px 0 12px;margin-top:6px}
.divider{height:1px;background:var(--line);margin:16px 0 14px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.field{margin-bottom:12px}
.field input{padding:11px 13px}
.icons{gap:6px;margin-bottom:10px}
.more{display:block;text-align:left;width:100%;padding:11px 2px;background:none;border:0;border-top:1px solid var(--line);font:500 14px var(--sans);color:var(--muted);cursor:pointer}
.more span{display:grid;transition:transform .2s}
.more span.flip{transform:rotate(180deg)}
.moreb{padding:6px 0 4px}
.dhead{margin-bottom:14px}
.stepper{padding:12px}

.look{display:grid;grid-template-columns:44px 1fr 1fr;gap:10px;align-items:end;margin-bottom:2px}
.look .tile{margin-bottom:12px}
.field select{width:100%;padding:11px 10px;border-radius:12px;border:1px solid var(--line);background-color:var(--bg);color:var(--ink);font:16px var(--sans)}

.look{grid-template-columns:1fr 1fr!important;align-items:start!important}
.ddbtn{display:flex;align-items:center;justify-content:space-between;width:100%;height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.ddbtn[aria-expanded="true"]{border-color:var(--g)}
.ddv{display:grid;place-items:center}
.ddc{color:var(--muted);display:grid}
.dot{display:block;width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--line)}
.ddpanel{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);margin:-2px 0 14px}
.ddpanel.colors{grid-template-columns:repeat(8,1fr)}
.ddo{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted);cursor:pointer;padding:0}
.ddo.on{color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card))}
.dds{width:28px;height:28px;border-radius:50%;background:var(--c);border:2px solid transparent;box-shadow:0 0 0 1px var(--line);justify-self:center;cursor:pointer;padding:0}
.dds.on{border-color:var(--card);box-shadow:0 0 0 2px var(--c)}

.hname{flex:1;min-width:0}
.nrow{display:flex;align-items:center;gap:8px;border-bottom:1px dashed var(--line)}
.nrow:focus-within{border-bottom:1px solid var(--g)}
.nameedit{flex:1;min-width:0;width:100%;font:400 24px/1.2 var(--serif);color:var(--ink);background:none;border:0;padding:2px 0;outline:none}
.nameedit::placeholder{color:var(--faint)}
.pen{color:var(--faint);display:grid;flex:none}
.hname p{margin:4px 0 0;font-size:13px;color:var(--muted)}

.look{grid-template-columns:1fr!important}
.tilebtn{border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--card));cursor:pointer;padding:0}
.popscrim{z-index:50}
.iconpop{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);max-height:min(64%,480px);z-index:51;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:fade .15s}
.iconpop h3{font:400 18px var(--serif);margin:0;padding:14px 18px 8px;flex:none}
.ipcolors{flex:none;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--card);border-radius:0 0 20px 20px}
.ipgrid{flex:1;min-height:0;overflow-y:auto;padding:6px 14px 16px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.hnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-4px}
.hcur{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.hcur .hr{display:flex;align-items:center;gap:8px;max-width:100%}
.hcur .pi{color:var(--c);display:grid;flex:none}
.hcur .pn{font:400 21px/1.2 var(--serif);overflow-wrap:anywhere}
.hcur .hs{font-size:12px;color:var(--muted);margin-top:2px}
.cell.blank{background:none;border:0;box-shadow:none;cursor:default;pointer-events:none}

button.hcur{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:2px 6px;border-radius:12px}
.hcur .hc{color:var(--muted);display:grid;flex:none}
.mini{cursor:default}
.hplist{overflow-y:auto;flex:1;min-height:0;padding:0 6px 8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.hpitem{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;background:none;border:0;border-radius:14px;text-align:left;cursor:pointer}
.hpitem.on{background:color-mix(in srgb,var(--c) 10%,var(--card))}
.hpn{flex:1;min-width:0}
.hpn b{display:block;font:400 17px/1.25 var(--serif);overflow-wrap:anywhere}
.hpn small{font-size:12px;color:var(--muted)}
.hpk{color:var(--g);display:grid}
.legend{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px}
.legend .lg1{background:color-mix(in srgb,var(--g) 34%,var(--card));border:1px solid color-mix(in srgb,var(--g) 55%,var(--card))}
.legend .lg2{background:var(--g)}
.allclear{text-align:center;color:var(--muted);font-size:14px;padding:18px 0 4px}

/* Feedback animations: 1 progress, 2 minimum, 3 full goal */
.row{position:relative}
@keyframes barbump{0%{transform:scaleY(1)}40%{transform:scaleY(2)}100%{transform:scaleY(1)}}
.row.a1 .bar{animation:barbump .45s ease-out}
.row.a1 .bar i{animation:barglow .6s ease-out}
@keyframes barglow{0%{filter:brightness(1.6) saturate(1.5)}100%{filter:none}}
.row.a1 .segs i.on{animation:segpop .4s ease-out}
@keyframes segpop{0%{transform:scaleY(1)}50%{transform:scaleY(2.2)}100%{transform:scaleY(1)}}
.row.a1 .act{animation:tap1 .3s ease-out}
@keyframes tap1{0%{transform:scale(1)}40%{transform:scale(.86)}100%{transform:scale(1)}}
.row.a2{animation:glow2 .8s ease-out}
@keyframes glow2{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--g) 55%,transparent)}100%{box-shadow:0 0 0 8px color-mix(in srgb,var(--g) 0%,transparent)}}
.row.a2 .namechk{animation:chkpop .6s cubic-bezier(.2,.9,.3,1.5)}
@keyframes chkpop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.6) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.row.a2 .bar{animation:barbump .5s ease-out}
.row.a3{animation:pulse3 .9s ease-out}
@keyframes pulse3{0%{transform:scale(1);box-shadow:0 0 0 0 color-mix(in srgb,var(--g) 60%,transparent)}25%{transform:scale(1.04)}100%{transform:scale(1);box-shadow:0 0 0 14px color-mix(in srgb,var(--g) 0%,transparent)}}
.row.a3::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;background-position:160% 0;animation:shine3 .9s .1s ease-out forwards}
@keyframes shine3{to{background-position:-60% 0}}
.row.a3 .act.ok{animation:pop3 .7s cubic-bezier(.2,.9,.3,1.5)}
@keyframes pop3{0%{transform:scale(.4) rotate(-30deg)}60%{transform:scale(1.55) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.ft{position:absolute;z-index:45;pointer-events:none;font-weight:700;color:var(--g);transform:translate(-50%,-50%);white-space:nowrap;text-shadow:0 0 8px var(--card),0 0 2px var(--card);animation:ftup 1s ease-out forwards}
.ft.t1{font-size:13px;--rise:34px}
.ft.t2{font-size:16px;--rise:58px}
.ft.t3{font-size:21px;--rise:88px}
@keyframes ftup{0%{opacity:0;transform:translate(-50%,calc(-50% + 6px)) scale(.8)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,calc(-50% - var(--rise))) scale(1.1)}}
.act.mn{background:color-mix(in srgb,var(--g) 20%,var(--card));border-color:var(--g);color:var(--g)}

/* Today hero: a sloth on a branch (its mood follows your progress) under a sky that follows the clock; the quote is its thought bubble. */
.hero{--sky1:#CFE6F5;--sky2:#F4FAF6;--orb:#FFE08A;--glow:rgba(255,224,138,.6);position:relative;display:block;padding:12px 14px 14px;margin-bottom:10px;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--sky1) 60%,var(--line));
  background:radial-gradient(circle at 91% 14%,var(--orb) 0 10px,transparent 11px),radial-gradient(circle at 91% 14%,var(--glow) 0,transparent 58px),linear-gradient(180deg,var(--sky1),var(--sky2))}
.hero[data-sky=dawn]{--sky1:#FFD9B8;--sky2:#FFF3E3;--orb:#FFB872;--glow:rgba(255,184,114,.55)}
.hero[data-sky=dusk]{--sky1:#F6B79F;--sky2:#F3DDEA;--orb:#FF9B7A;--glow:rgba(255,155,122,.5)}
.hero[data-sky=night]{--sky1:#2B3566;--sky2:#46557F;--orb:#F4EDCB;--glow:rgba(244,237,203,.35);
  background:radial-gradient(circle at 91% 14%,var(--orb) 0 10px,transparent 11px),radial-gradient(circle at 91% 14%,var(--glow) 0,transparent 58px),
  radial-gradient(circle at 14% 20%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 34% 12%,#fff 0 1.2px,transparent 1.8px),radial-gradient(circle at 55% 30%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 76% 10%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 8% 55%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 60% 6%,#fff 0 1.2px,transparent 1.8px),
  linear-gradient(180deg,var(--sky1),var(--sky2))}
@media (prefers-color-scheme:dark){
  .hero[data-sky=day]{--sky1:#2E4D63;--sky2:#1C2C30;--glow:rgba(255,224,138,.28)}
  .hero[data-sky=dawn]{--sky1:#5C4538;--sky2:#2A2523;--glow:rgba(255,184,114,.28)}
  .hero[data-sky=dusk]{--sky1:#5B3B4C;--sky2:#2A2230;--glow:rgba(255,155,122,.28)}
  .hero[data-sky=night]{--sky1:#161C3A;--sky2:#242E52}
}
.hero.gold{border-color:#E6A100;box-shadow:0 0 0 2px color-mix(in srgb,#E6A100 38%,transparent),var(--shadow)}
.hscene{display:flex;align-items:flex-start;gap:6px}
.hslot{flex:0 0 128px;width:128px;margin-left:-6px;position:relative;z-index:1}
.hslot svg{display:block;width:100%;height:auto;overflow:visible}
.hbubble{position:relative;flex:1;min-width:0;margin-top:24px;padding:11px 13px;border-radius:18px;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.hbubble::before{content:"";position:absolute;left:-6px;top:30px;width:13px;height:13px;background:var(--card);transform:rotate(45deg);border-radius:3px}
.qt{margin:0;font:italic 400 15px/1.4 var(--serif);font-size:clamp(14px,3.9vw,16px);overflow-wrap:anywhere}
.qs{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:1.2;color:var(--muted)}
.qs svg{color:var(--c);flex:none}
.hprog{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 12px;border-radius:16px;background:color-mix(in srgb,var(--card) 90%,transparent);box-shadow:0 1px 6px rgba(0,0,0,.06)}
.hprog .ringwrap{width:42px;height:42px;flex:none}
.hprog .ringwrap>svg{width:100%;height:100%}
.hcount{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.hcount b{font:400 19px/1.1 var(--serif);white-space:nowrap}
.hcount span{font-size:12px;color:var(--muted);white-space:nowrap}
.hprog .hstreak{margin-left:auto;flex:none}
.hstreak{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:999px;font-size:13px;font-weight:600;line-height:1.2;white-space:nowrap;color:color-mix(in srgb,#F26A3D 78%,var(--ink));background:color-mix(in srgb,#F26A3D 13%,var(--card));border:1px solid color-mix(in srgb,#F26A3D 26%,transparent)}
.hstreak svg{flex:none;color:#F26A3D;fill:color-mix(in srgb,#F26A3D 30%,transparent)}
.hstreak b{font-weight:700;color:inherit}
.hstreak.hot{background:color-mix(in srgb,#F26A3D 20%,var(--card));border-color:color-mix(in srgb,#F26A3D 42%,transparent)}
/* the branch the sloth hangs from (it lines up with the hands in the artwork) */
.hbranch{position:absolute;left:-2px;right:-2px;top:19px;height:12px;z-index:0;border-radius:6px;background:linear-gradient(180deg,#B07A4E 0 62%,#955E3A 62% 100%);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.hbranch::before,.hbranch::after{content:"";position:absolute;width:30px;height:14px;background:#6FA074;border-radius:100% 0 100% 0}
.hbranch::before{left:7%;top:-10px;transform:rotate(-14deg)}
.hbranch::after{right:9%;top:-9px;transform:rotate(16deg) scaleX(-1)}
/* sloth stages: the sleepier, the slower the sway */
.hs{transform-origin:280px 20px;animation:hsw 5.5s ease-in-out infinite}
.hs.s0{animation-duration:6.8s}.hs.s1{animation-duration:6.2s}.hs.s2{animation-duration:5.6s}.hs.s3{animation-duration:5s}.hs.s4{animation-duration:4.3s}.hs.s5{animation-duration:3.6s}.hs.s6{animation-duration:3.2s}.hs.s7{animation-duration:2.8s}.hs.s8{animation-duration:2.3s}
.hs.s9{animation:hsp 1s ease-in-out infinite}
@keyframes hsw{0%,100%{transform:rotate(-.55deg)}50%{transform:rotate(.55deg)}}
@keyframes hsp{0%,100%{transform:rotate(-1.3deg) translateY(0)}50%{transform:rotate(1.3deg) translateY(-5px)}}
.spark{animation:spk .5s ease-in-out infinite alternate}
@keyframes spk{from{opacity:.35;transform:scale(.92)}to{opacity:1;transform:scale(1.06)}}
.spark{transform-origin:280px 390px}
.hsvg .zz{font:700 64px var(--serif);fill:#fff;stroke:#5B6B8C;stroke-width:2.4px;paint-order:stroke;opacity:0;animation:zrise 3.4s ease-in infinite}
.z2{animation-delay:.9s}.z3{animation-delay:1.8s}
@keyframes zrise{0%{opacity:0;transform:translate(0,24px)}25%{opacity:1}100%{opacity:0;transform:translate(34px,-70px)}}

.act,.act *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.act{touch-action:manipulation}
.act svg{pointer-events:none}
.act{position:relative}
.act::before{content:"";position:absolute;inset:-14px}   /* invisible buffer: near-misses still hit the button */
.row *::selection{background:transparent;color:inherit}
.act.holding{transform:scale(.9);box-shadow:0 0 0 5px color-mix(in srgb,var(--g) 25%,transparent);transition:transform .2s,box-shadow .2s}
.apscrim{position:fixed;inset:0;z-index:50;background:transparent}
.appop{position:fixed;z-index:51;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.22);padding:10px 10px 8px;animation:fade .12s}
.aprow{display:flex;align-items:center;gap:8px}
.apb{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.apb.add{background:var(--g);border-color:var(--g);color:var(--on-g)}
.apfield{flex:1;min-width:0;display:flex;align-items:center;gap:4px;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.apfield:focus-within{border-color:var(--g)}
.apfield input{flex:1;min-width:0;width:100%;border:0;background:none;outline:none;font:400 20px var(--serif);color:var(--ink);text-align:center}
.apu{color:var(--muted);font-size:12px;white-space:nowrap}
.apcap{font-size:12px;color:var(--muted);text-align:center;margin-top:7px;min-height:15px}
.apcap.bad{color:var(--danger)}
.apcaret{position:absolute;width:12px;height:12px;background:var(--card);transform:rotate(45deg)}
.apcaret.dn{bottom:-7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.apcaret.up{top:-7px;border-left:1px solid var(--line);border-top:1px solid var(--line)}

/* All-done card: hammock sloth, gently swaying. (Image is wider than the card so the rope ends stay hidden while it sways.) */
.slothcard{--dash:color-mix(in srgb,var(--muted) 58%,transparent);position:relative;margin-top:14px;padding:8px 0 16px;text-align:center;border-radius:22px;overflow:hidden;border:2px dashed var(--dash);background:transparent;box-shadow:none}   /* blank beige with a crafty dashed outline: no green, no white */

.tgl{display:flex;align-items:center;gap:9px;background:none;border:0;padding:6px 0 6px 6px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
.tgl .sw{position:relative;display:block;width:42px;height:26px;border-radius:13px;background:var(--track);border:1px solid var(--line);transition:background .2s,border-color .2s;flex:none}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .2s}
.tgl[aria-checked="true"] .sw{background:var(--g);border-color:var(--g)}
.tgl[aria-checked="true"] .sw::after{transform:translateX(16px)}
.tgl[aria-checked="true"]{color:var(--ink)}
.rsub button.minchip.go{font-weight:600;color:var(--g);background:color-mix(in srgb,var(--g) 12%,var(--card));border-color:color-mix(in srgb,var(--g) 42%,transparent)}
.namechk.win{display:inline-flex;align-items:center;gap:5px;padding:4px 11px 4px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--g) 48%,transparent);background:color-mix(in srgb,var(--g) 13%,var(--card));color:var(--g);font:600 12px/1.2 var(--sans);cursor:pointer;white-space:nowrap;flex:none;-webkit-user-select:none;user-select:none}
.namechk.win svg{flex:none}
.row.a2 .namechk.win{animation:winpop .55s cubic-bezier(.2,.9,.3,1.4)}
@keyframes winpop{0%{transform:scale(.5);opacity:0}65%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.rsub .rline{flex:1 1 100%;display:flex;align-items:center;flex-wrap:wrap;gap:1px 4px;min-width:0;font-size:11px;color:var(--muted)}
.rline .rcue{margin-top:0;gap:2px;flex:0 1 auto;min-width:0;overflow:visible;align-items:flex-start}
.rline .rcue svg{margin-top:1px}
.rline .rcue span{white-space:normal;overflow:visible;text-overflow:clip}   /* the full cue is always shown */
.rline .rmin{flex:none;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;font-size:11px;font-weight:600;color:color-mix(in srgb,var(--c) 68%,var(--ink))}
.rline .rmin svg{display:block}
.rline .sep{color:var(--faint);flex:none}
.rmin{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.35;color:var(--muted);white-space:nowrap}
button.rmin{background:none;border:0;padding:0;font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--muted) 55%,transparent)}
button.rmin.on{color:var(--g);text-decoration:none}
.verline{margin-top:26px;text-align:center;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.verline b{font-weight:600;color:var(--ink)}
.verline span{font-size:12px;color:var(--faint)}
.popscrim.still,.iconpop.still{animation:none}
/* second celebration: a whole weekly or monthly cycle is closed */
.cyclecard{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:8px;border-radius:18px;border:2px dashed #E0A21A;background:radial-gradient(ellipse 90% 150% at 0% 0%,rgba(230,161,0,.2),transparent 70%)}
.cyclecard.enter{animation:slin .5s ease-out}
.cyctrophy{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,#F2B83A,#D98E00);box-shadow:0 4px 12px rgba(217,142,0,.35)}
.cyctrophy svg{color:#fff}
.cyctext{display:flex;flex-direction:column;gap:2px;min-width:0}
.cyctext b{font:400 20px/1.2 var(--serif)}
.cyctext span{font-size:13.5px;line-height:1.35;color:var(--muted)}
/* Skipping: swipe a habit left to reveal Skip */
#screen{overflow-x:hidden}
.grp .row{touch-action:pan-y}
.skipact{position:absolute;left:calc(100% + 8px);top:0;bottom:0;width:var(--sw,84px);min-width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:16px;padding:0;background:color-mix(in srgb,var(--muted) 88%,#000);color:#fff;font:600 12px var(--sans);cursor:pointer;visibility:hidden}
.row.swiping .skipact{visibility:visible}
.row.arm .skipact{background:#9A6A1E}
.row.skipped{background:transparent;border:1.5px dashed color-mix(in srgb,var(--muted) 50%,transparent);box-shadow:none}
.row.skipped .tile{filter:grayscale(1);opacity:.55}
.row.skipped .rn{color:var(--muted)}
.skiptag{margin-left:8px;padding:2px 9px;border:1px dashed color-mix(in srgb,var(--muted) 55%,transparent);border-radius:999px;font:600 11px var(--sans);color:var(--muted);white-space:nowrap;align-self:center}
.skipnote{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:10px 0 0;padding:9px;border:1.5px dashed color-mix(in srgb,var(--muted) 45%,transparent);border-radius:14px;background:none;color:var(--muted);font:500 13px var(--sans);cursor:pointer}
.cell.skip{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--muted) 16%,transparent) 5px 7px),var(--card);border:1.5px dashed color-mix(in srgb,var(--muted) 50%,transparent);color:var(--muted)}
.cell.skip svg{color:var(--muted)}
.legend .lg3{background:repeating-linear-gradient(135deg,transparent 0 3px,color-mix(in srgb,var(--muted) 25%,transparent) 3px 4px),var(--card);border:1px dashed color-mix(in srgb,var(--muted) 55%,transparent)}
.g i.ms{background:color-mix(in srgb,var(--muted) 38%,var(--card))}
.strip .sk{fill:color-mix(in srgb,var(--muted) 40%,var(--card))}
.iphead{display:flex;align-items:center;justify-content:space-between;flex:none;padding:14px 12px 8px 18px}
.iconpop .iphead h3{padding:0}
.ipdone{background:none;border:0;padding:8px 10px;font:600 15px var(--sans);color:var(--g);cursor:pointer;border-radius:10px}
/* ===== v2 look: a scene at the top, a sheet of habit cards, a floating tab bar ===== */
:root{--sheet:#F5EFE4;--card2:#FCFAF5;--title:#163A2F;--deep:#16503C}
@media (prefers-color-scheme:dark){:root{--sheet:#121814;--card2:#1A211D;--title:#D7E8DD;--deep:#2E8B66}}
#screen{padding-bottom:118px}
#app[data-tab="today"] #screen{background:var(--sheet);padding-top:2px}
#app[data-tab="today"] #head{background:transparent}
.tabbar{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:7;display:flex;gap:4px;padding:6px;border:0;border-radius:32px;background:color-mix(in srgb,var(--card2) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 28px rgba(50,38,20,.22)}
.tab{padding:9px 0 8px;border-radius:26px;font:600 12.5px var(--sans);color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{background:var(--deep);color:#fff}
/* the scene */
.todayhead{position:relative;z-index:1}
.scene{position:relative;height:290px;overflow:hidden;--sc-ink:#14382D;--sc-ink2:rgba(20,56,45,.8);--sc-glass:rgba(252,248,240,.9);--scrim:rgba(255,255,255,.62)}
.scene[data-ink="light"]{--sc-ink:#FFF4E2;--sc-ink2:rgba(255,244,226,.85);--sc-glass:rgba(20,26,48,.58);--scrim:rgba(10,14,40,.58)}
.sc-text{text-shadow:0 0 10px rgba(255,255,255,.75),0 0 2px rgba(255,255,255,.55)}
.scene[data-ink="light"] .sc-text{text-shadow:0 1px 10px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.4)}
.sc-text{position:absolute;left:20px;top:calc(env(safe-area-inset-top) + 28px);width:55%;color:var(--sc-ink);z-index:2;isolation:isolate}
.sc-text::before{content:"";position:absolute;inset:-26px -4px -30px -30px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 62% 74% at 40% 44%,var(--scrim) 0,var(--scrim) 40%,transparent 100%)}   /* a soft veil so the words stay readable over clouds, sun and moon */
.sc-date{font:600 12px var(--sans);letter-spacing:.14em;color:var(--sc-ink2)}
.sc-text h1{margin:4px 0 6px;font:700 29px/1.08 var(--serif);letter-spacing:-.01em;color:var(--sc-ink)}
.sc-leaf{display:inline-block;width:20px;height:20px;vertical-align:-2px;line-height:0;color:#4E9A57}
.sc-leaf svg{width:20px;height:20px}
.nw{white-space:nowrap}
.sc-tag{margin:0;font:500 15px/1.35 var(--sans);color:var(--sc-ink)}
.sc-btns{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 14px);display:flex;gap:10px;z-index:3}
.sc-btns button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,252,246,.94);color:var(--deep);display:grid;place-items:center;box-shadow:0 3px 10px rgba(30,40,30,.22);cursor:pointer;padding:0}
.sc-sloth{position:absolute;left:57%;top:58px;width:124px;z-index:1;pointer-events:none}
.sc-sloth .hsvg{width:100%;height:auto;display:block;overflow:visible}
.sc-card{position:absolute;right:14px;bottom:44px;z-index:2;display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;border-radius:20px;background:var(--sc-glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(30,40,30,.18);color:var(--sc-ink)}
.sc-card .ringwrap{width:46px;height:46px;flex:none;position:relative}
.sc-card .ringwrap svg{width:100%;height:100%;display:block}
.sc-card .hcount{display:flex;flex-direction:column;gap:1px;line-height:1.2}
.sc-card .hcount b{font:600 17px var(--serif)}
.sc-card .hcount span{font:400 12.5px var(--sans);color:var(--sc-ink2)}
.sc-card .flm{display:flex;align-items:center;gap:4px;margin-top:2px;font:600 12.5px var(--sans);font-style:normal;color:#E0622B}
.sc-card.gold .hcount b{color:#E6A100}

/* the sheet */
.sheethead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 20px 10px;background:var(--sheet)}
.sheethead h2{margin:0;font:700 28px/1.1 var(--serif);color:var(--title)}
.sh-right{display:flex;flex-direction:column;align-items:flex-end}
.sh-left{font:500 16px var(--sans);color:var(--muted)}
.sheethead .tgl{font-size:12px;padding:3px 0 0}
.sheethead .tgl .sw{width:34px;height:20px;border-radius:10px}
.sheethead .tgl .sw::after{width:14px;height:14px;top:2px;left:2px}
.sheethead .tgl[aria-checked="true"] .sw::after{transform:translateX(14px)}
.sect{margin:14px 4px 8px;font:600 12.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
/* the habit cards */
.row{display:block;padding:14px 14px 12px;border:0;border-radius:22px;background:var(--card2);box-shadow:0 2px 12px rgba(80,60,30,.08);margin-bottom:12px;text-align:left}
.row.done{background:color-mix(in srgb,var(--c) 11%,var(--card2));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 30%,transparent),0 2px 12px rgba(80,60,30,.06)}
.row.done.mid{background:color-mix(in srgb,var(--c) 6%,var(--card2));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 18%,transparent),0 2px 12px rgba(80,60,30,.06)}
.rtopline{display:flex;align-items:center;gap:13px}
.rmain{flex:1;min-width:0}
.row .tile{width:54px;height:54px;border-radius:17px;background:color-mix(in srgb,var(--c) 17%,var(--card2));color:var(--c)}
.row .rname{display:block;font:600 21px/1.18 var(--serif);color:var(--title)}
.row .rwhy{font:italic 400 14.5px/1.3 var(--serif);color:var(--muted);margin-top:3px}
.row .act{width:46px;height:46px;border:2px solid color-mix(in srgb,var(--muted) 55%,transparent);background:transparent;color:color-mix(in srgb,var(--muted) 75%,transparent)}
.row .act svg{width:22px;height:22px}
.row .act[data-a="add"]{background:var(--deep);border-color:var(--deep);color:#fff}
.row .act.ok{background:var(--deep);border-color:var(--deep);color:#fff}
.row .act.mn{background:color-mix(in srgb,var(--deep) 16%,var(--card2));border-color:var(--deep);color:var(--deep)}
.row .act.undo{border-color:color-mix(in srgb,var(--muted) 55%,transparent);background:transparent;color:var(--muted)}
.rstats{display:flex;align-items:center;gap:14px;margin-top:12px;padding-top:11px;border-top:1px solid color-mix(in srgb,var(--muted) 18%,transparent)}
.rcountcol{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.rcount{flex:none;font:500 15.5px var(--sans);color:var(--title);white-space:nowrap}
.rcount small{display:block;font:400 12px var(--sans);color:var(--muted)}
.rcountcol .bar{flex:1;min-width:46px;height:10px;border-radius:5px;margin-top:0;background:color-mix(in srgb,var(--muted) 18%,transparent)}
.rcountcol .bar i{border-radius:5px}
.rcountcol .bar .tick{background:var(--card2)}
.vsep{flex:none;width:1px;align-self:stretch;min-height:34px;background:color-mix(in srgb,var(--muted) 26%,transparent)}
.mincol{flex:none;display:flex;align-items:center;gap:10px}
.mcircle{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid color-mix(in srgb,var(--muted) 60%,transparent);background:transparent;display:grid;place-items:center;color:#fff;padding:0}
.mcircle.on{background:var(--deep);border-color:var(--deep)}
.mcircle.ready{position:relative;border-color:var(--deep);color:var(--deep);background:color-mix(in srgb,var(--deep) 14%,transparent)}
.mcircle.ready::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--deep);opacity:0;pointer-events:none;animation:readyring 1.9s ease-out infinite;will-change:transform,opacity}   /* a ring that grows and fades: moved by the phone's graphics chip, no repainting */
@keyframes readyring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes readyp{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--deep) 35%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--deep) 0%,transparent)}}
.mincol .mcircle{flex:none;display:grid;place-items:center;width:30px;height:30px;padding:0;border-radius:50%;border:2px solid color-mix(in srgb,var(--muted) 60%,transparent);background:transparent;color:#fff;text-decoration:none;font-size:0;cursor:default}
.mincol{position:relative}
button.mincol{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-appearance:none;appearance:none}
button.mincol::before{content:"";position:absolute;inset:-12px -8px}   /* the circle and its words, plus a little room around them, all count as the button */
button.mincol .mintxt{display:flex;flex-direction:column;line-height:1.2}
button.mincol:active .mcircle{transform:scale(.92)}
.mincol .mcircle.on{background:var(--deep);border-color:var(--deep);color:#fff}
.mincol .mcircle.ready{border-color:var(--deep);color:var(--deep);background:color-mix(in srgb,var(--deep) 14%,transparent)}
.mintxt{display:flex;flex-direction:column;line-height:1.2}
.mintxt span{font:400 12.5px var(--sans);color:var(--muted)}
.mintxt b{font:500 16px var(--serif);color:var(--title)}
.mintxt b.claim{font:600 14px var(--sans);color:var(--deep)}
.mintxt .minchip{margin:3px 0 0;padding:0;border:0;background:none;color:var(--deep);font:600 12.5px var(--sans);text-align:left}
.cuebar{display:flex;align-items:center;gap:10px;margin-top:11px;padding:10px 14px;border-radius:13px;background:color-mix(in srgb,var(--muted) 12%,transparent);font:400 15px/1.3 var(--sans);color:var(--title)}
.cuebar svg{flex:none;opacity:.75}
.skipact{border-radius:22px}
.row.skipped .rmain{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.row.skipped .skiptag{margin:0}
.addbtn{background:var(--card2);border:0;box-shadow:0 2px 12px rgba(80,60,30,.08);padding:14px;font-size:15px}
/* pop-ups (with Undo) appear at the top, clear of the tab bar and of the sloths */
#toast,#toast.up{top:calc(env(safe-area-inset-top) + 12px);bottom:auto}
@keyframes tdown{from{transform:translateY(-34px);opacity:0}to{transform:none;opacity:1}}
.toast{animation:tdown .25s;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.toast button{padding:6px 4px 6px 10px}
/* a finished habit slides away */
.row.leaving,.cyclecard.leaving{border-width:0;height:0!important;opacity:0;margin-bottom:0;padding-top:0;padding-bottom:0;transform:translateX(26px) scale(.97);overflow:hidden;pointer-events:none;animation:none!important;transition:height .21s cubic-bezier(.4,0,.2,1),opacity .17s ease-out,transform .21s ease-in,margin .21s,padding .21s}
/* the sheet slides up over the scene */
.sheethead{position:relative}
#app[data-tab="today"]:not([data-sheet="expanded"]) #screen{overflow-y:hidden}
#head,#app[data-tab="today"]:not([data-sheet="expanded"]) #screen{touch-action:none}
#screen{touch-action:pan-y}
/* smaller text under each habit's name */
.row .rwhy{font-size:12.5px;margin-top:2px}
.rstats{margin-top:10px;padding-top:9px;gap:12px}
.rcount{font-size:13.5px}
.rcount small{font-size:11px}
.rcountcol{gap:10px}
.rcountcol .bar{height:8px;border-radius:4px}
.rcountcol .bar i{border-radius:4px}
.mincol{gap:8px}
.mincol .mcircle{width:26px;height:26px}
.mintxt span{font-size:11px}
.mintxt b{font-size:14px}
.mintxt b.claim{font-size:12.5px}
.mintxt .minchip{font-size:11px}
.cuebar{gap:8px;margin-top:9px;padding:8px 12px;border-radius:12px;font-size:13px}
.cuebar svg{width:16px;height:16px}
/* ===== smooth: the stage slides as one layer; each moving part of the scene is its own layer ===== */
#app{display:block}
#stage{position:absolute;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column;will-change:transform}
#app[data-tab="today"] #stage{height:calc(100% + 262px)}   /* the extra height is the room the sheet slides into */
#app.snap #stage,#app.snap .scene{transition:transform .34s cubic-bezier(.2,.8,.3,1)}
#app.snap .sc-ui{transition:opacity .28s}
.scene{will-change:transform;contain:layout paint}   /* whatever the scene repaints stays inside the scene */
.sc-layer{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.sc-ui{position:absolute;inset:0;z-index:2;pointer-events:none}
.sc-ui>*{pointer-events:auto}
.sc-sloth{pointer-events:none}
.sheethead{margin-top:-28px;border-radius:28px 28px 0 0;padding:24px 20px 10px;z-index:1}
.sh-grab{position:absolute;top:9px;left:50%;width:46px;height:5px;margin-left:-23px;padding:0;border:0;border-radius:3px;background:color-mix(in srgb,var(--muted) 38%,transparent);cursor:pointer}
.sh-grab::before{content:"";position:absolute;inset:-14px -22px}
#app[data-sheet="expanded"] .sheethead{border-radius:0}
#app[data-sheet="expanded"] .scene{visibility:hidden}
#app[data-sheet="expanded"] .scene *{animation-play-state:paused}
.cld{fill:var(--cloud);opacity:var(--cloudO);will-change:transform}
.cld.c1{animation:cloudA 95s linear infinite}.cld.c2{animation:cloudA 140s linear -50s infinite}.cld.c3{animation:cloudA 70s linear -20s infinite}
@keyframes cloudA{from{transform:translate3d(-62%,0,0)}to{transform:translate3d(62%,0,0)}}
.sc-stars,.sc-flies{position:absolute;inset:0;opacity:var(--starO);pointer-events:none}
.twk{animation:twinkle 3.2s ease-in-out infinite;will-change:opacity}.twk.t1{animation-delay:-1s}.twk.t2{animation-delay:-2s}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.sc-sun{opacity:var(--sunO)}.sc-moon{opacity:var(--moonO)}.sc-ref{opacity:var(--sunO)}
.shl{animation:shim 4.5s ease-in-out infinite;will-change:opacity}.shl.s2{animation-delay:-2.2s}
@keyframes shim{0%,100%{opacity:.15}50%{opacity:.9}}
.lvl{will-change:transform}
.lvl.a{transform-origin:8% 45%;animation:swayA 7s ease-in-out infinite}
.lvl.b{transform-origin:78% 0;animation:swayA 9s ease-in-out -3s infinite}
.lvl.d{transform-origin:96% 8%;animation:swayA 8s ease-in-out -5s infinite}
.lvl.c{transform-origin:88% 14%;animation:swayA 6s ease-in-out -1.5s infinite}
@keyframes swayA{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
.flyl{animation:fly 7s ease-in-out infinite,glowf 2.4s ease-in-out infinite;will-change:transform,opacity}.flyl.f1{animation-delay:-3s,-1s}.flyl.f2{animation-delay:-5s,-2s}
@keyframes fly{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(14px,-18px,0)}}
@keyframes glowf{0%,100%{opacity:.25}50%{opacity:1}}
.sc-sloth .hsvg{transform-origin:50% 5%;animation:slothsway 5.2s ease-in-out infinite;will-change:transform}
.sc-sloth .hs{animation:none}
@keyframes slothsway{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg)}}
.tabbar{-webkit-backdrop-filter:none;backdrop-filter:none;background:color-mix(in srgb,var(--card2) 97%,transparent)}
.sc-card{-webkit-backdrop-filter:none;backdrop-filter:none}
/* a day in the calendar */
.dayhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.daypanel{margin-top:22px}
.dtitle{margin:0 0 2px;font:600 22px/1.15 var(--serif);color:var(--title)}
.dhide{display:block;margin:4px auto 0;padding:8px 14px}
.cell.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--deep) 60%,transparent)}
.dsub{font-size:14px;color:var(--muted);margin-bottom:14px}
.daynav{display:flex;gap:8px;padding-top:4px}
.daynav button{width:38px;height:38px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--muted) 40%,transparent);background:var(--card2);color:var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}
.dayrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card2);box-shadow:0 1px 8px rgba(80,60,30,.08);margin-bottom:9px}
.dayrow.done{background:color-mix(in srgb,var(--c) 11%,var(--card2));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 28%,transparent)}
.dayrow.skipped{background:transparent;box-shadow:none;border:1.5px dashed color-mix(in srgb,var(--muted) 45%,transparent)}
.dchk{flex:none;position:relative;width:46px;height:46px;border-radius:50%;border:2.5px solid var(--c);background:transparent;color:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
.dchk::before{content:"";position:absolute;inset:-6px}
.dchk.ok{background:var(--c)}
.dchk.mn{background:color-mix(in srgb,var(--c) 26%,transparent);color:var(--c)}
.dinfo{flex:1;min-width:0}
.dname{font:600 18px/1.2 var(--serif);color:var(--title);overflow-wrap:anywhere}
.dstat{font-size:13px;line-height:1.3;color:var(--muted);margin-top:2px}
.dlinks{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px}
.dlink{background:none;border:0;padding:5px 0;font:600 12.5px var(--sans);color:var(--deep);cursor:pointer}
.dstep{flex:none;display:flex;align-items:center;gap:6px}
.dstep button{width:34px;height:34px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--muted) 45%,transparent);background:transparent;color:var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.dnum{width:52px;height:36px;text-align:center;border:1.5px solid color-mix(in srgb,var(--muted) 35%,transparent);border-radius:10px;background:var(--bg);color:var(--ink);font:600 16px var(--sans);padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Core logic ---------- */
const val=(h,dk)=>(S.logs[h.id]&&S.logs[h.id][dk])||0;
function periodRange(h,d){
  if(h.period==='daily')return [d,d];

}
function progress(h,d){
  if(h.period==='daily')return val(h,key(d));

  for(let x=a;x<=b;x=addDays(x,1))sum+=val(h,key(x))

}
/* Minimum that still counts as done:
   amounts (any period) and weekly/monthly counts use a number; daily yes/no habits use a smaller written version (logged as 0.5). */
const need=h=>{
  if(h.kind==='binary'&&h.period==='daily')return h.minText?0.5:h.goal;
  return (h.min>0&&h.min<h.goal)?h.min:h.goal;
};
/* Daily yes/no habits with a minimum: one tap on the check = fully done. The minimum has its own button (the chip).
   In the calendar the days cycle through full, minimum, none. */
const nextBinary=(h,v,cal)=>{
  if(h.kind==='binary'&&h.period==='daily'&&h.minText){
    if(cal)return v===0?1:(v>=1?0.5:0);
    return v>=1?0:1;
  }
  if(h.kind==='binary'&&h.period!=='daily'&&h.goal>=2)return v>=h.goal?0:v+1;
  return v>0?0:1;
};
/* Add to today, or take away: subtract from today first, then reach back through earlier days of the same week or month. */
function adjustPeriod(h,dk,delta){
  if(delta>=0){setAmount(h,dk,val(h,dk)+delta);return}
  let rem=-delta;const d=parse(dk),a=periodRange(h,d)[0];
  for(let x=d;x>=a&&rem>1e-9;x=addDays(x,-1)){
    const k=key(x),v=val(h,k);if(v<=0)continue;
    const take=Math.min(v,rem);setAmount(h,k,v-take);rem-=take;
  }
}
/* Opt-in: once the minimum is reached you can say "that's enough" and the habit counts as finished (for that day, week or month). */
const settleKey=(h,d)=>key(periodRange(h,d)[0]);
const isSettled=(h,d)=>!!(S.settle[h.id]&&S.settle[h.id][settleKey(h,d)])&&isMet(h,d);
const isFinished=(h,d)=>progress(h,d)>=h.goal||isSettled(h,d);
/* Skipping: excuse a habit for today (or this week or month, for those). A skip never breaks a streak and is left out of your rates,
   but it does not count as done either. Doing the habit afterwards cancels the skip. */
const isSkipped=(h,d)=>!!(S.skips[h.id]&&S.skips[h.id][settleKey(h,d)])&&!isMet(h,d);

/* A yes/no habit is just done or not done: it never has a count. Anything counted is an amount (for example "2 times" a week). */
function yesNoNeverCounts(h){
  if(h.kind==='binary'&&(h.goal>1)){h.kind='amount';h.unit=h.unit||'times';h.step=1;h.minText=''}
  else if(h.kind==='binary'){h.goal=1;h.min=0}

}
/* "1 glass", "2 glasses", "1 time": the unit loses its plural for exactly one */
const unitFor=(n,u)=>{u=u||'';if(n!==1)return u;if(/sses$/i.test(u))return u.slice(0,-2);if(/ies$/i.test(u))return u.slice(0,-3)+'y';if(/[^s]s$/i.test(u))return u.slice(0,-1);return u};

  if(h.period==='daily')return h.minText||'';

}
const isMet=(h,d)=>progress(h,d)>=need(h);
function level(h,d){

function units(h,from,to){
  const t=today(),cr=parse(h.created),out=[];

  if(h.period==='daily'){
    for(let d=a;d<=b;d=addDays(d,1)){const met=isMet(h,d);if(met||d<t)out.push({s:d,e:d,met,skip:isSkipped(h,d)})}

  const L=S.logs[h.id]||(S.logs[h.id]={});v=Math.max(0,Math.round(v*100)/100);
  if(v>0){L[dk]=v;const sk=S.skips[h.id],k2=settleKey(h,parse(dk));if(sk&&sk[k2])delete sk[k2]}else delete L[dk];   // doing it cancels a skip

function fxTick(){

  FX.ps=FX.ps.filter(p=>p.life<p.max&&p.y<FX.h+20);

    p.vy+=p.g;p.vx*=p.dr;p.vy*=p.dr;p.x+=p.vx+(p.sw?Math.sin(p.life*.12+p.ph)*p.sw:0);p.y+=p.vy;p.rot+=p.vr;p.life++;

  const num=k=>a[k]+(b[k]-a[k])*t,col=k=>mixHex(a[k],b[k],t);

/* move the sky, sun and moon along without redrawing the whole page */
function refreshScene(){
  const sc=document.querySelector('#scene');if(!sc||!sc.style||!sc.setAttribute)return;
  const th=sceneTheme(new Date(Date.now()));
  if(sc.style.setProperty)Object.entries(th.vars).forEach(([k,v])=>sc.style.setProperty(k,v));else sc.style.cssText=th.style;
  sc.setAttribute('data-ink',th.light?'light':'dark');
  const set=(id,fn)=>{const e=document.querySelector(id);if(e&&e.setAttribute)fn(e)};
  set('#scSun',e=>e.setAttribute('transform',`translate(${th.sun[0].toFixed(1)} ${th.sun[1].toFixed(1)})`));
  set('#scMoon',e=>e.setAttribute('transform',`translate(${th.moon[0].toFixed(1)} ${th.moon[1].toFixed(1)})`));
  set('#scSunRef',e=>e.setAttribute('x',(th.sun[0]-9).toFixed(1)));
  const g=document.querySelector('#scGreet');if(g)g.textContent=greeting();
}

    }else if(met&&!full){
      mincol=`<button class="mincol mbtn win" data-a="settle" data-id="${h.id}" aria-label="Claim ${per} win"><span class="mcircle ready" aria-hidden="true">${ck}</span><span class="mintxt"><span>Minimum win</span><b class="claim">Tap to claim</b></span></button>`;
    }else if(full){

    }

function quotePool(sk,left,gold){
  const q=[];
  if(gold)q.push({text:'Perfect day. Everything is done. Rest well.'});
  else if(left>0&&left<=3)q.push({text:`Only ${left} to go today. You\u2019ve got this.`});
  if(sk>=2)q.push({text:`${sk} days in a row. Keep it going.`});
  QUOTES.forEach(t=>q.push({text:t}));
  return q;
}
function quoteHTML(q){return `<p class="qt">${esc(q.text)}</p>${q.src?`<span class="qs" style="--c:${q.color}">${icon(q.ic,14)}${esc(q.src)}</span>`:''}`}
function currentQuotePool(){
  const t=today(),daily=S.habits.filter(h=>h.period==='daily'),left=daily.filter(h=>!isMet(h,t)).length;
  return quotePool(dayRuns(earliest(),t).cur,left,isPerfect(t));
}
/* The message is picked when the app opens, when you come back to it, or when you switch to the Today tab. It never changes while you're looking at it. */
function pickQuote(){
  const pool=currentQuotePool();if(!pool.length)return null;
  let q=pool[0];
  for(let i=0;i<6;i++){q=pool[Math.floor(Math.random()*pool.length)];if(!S.quote||q.text!==S.quote.text)break}
  S.quote=q;return q;
}
function renderToday(){
  const t=today(),tk=key(t);
  const pool=S.habits;
  const isSk=h=>isSkipped(h,t);
  const isDone=h=>(isFinished(h,t)&&S.hold!==h.id)||isSk(h);   // full goal, you chose "that's enough" at the minimum, or you skipped it
  const todo=pool.filter(h=>!isDone(h)),doneList=pool.filter(isDone);
  const rs=pool.filter(h=>h.period==='daily'),base=rs.length?rs:pool,ringSet=base.filter(h=>!isSk(h));   // the count is for today's daily habits only, minus the ones you skipped
  const done=ringSet.filter(h=>isFinished(h,t)).length,tot=ringSet.length,restDay=tot===0&&base.length>0,nSk=pool.filter(isSk).length;
  const sk=dayRuns(earliest(),t).cur,all=tot>0&&done===tot&&dailyReady(true);
  const q=S.quote||pickQuote();
  const left=Math.max(0,tot-done);
  const scene=sceneHTML({hasHabits:S.habits.length>0,done,tot,restDay,all,gold:all,sk,quote:q?q.text:'Small steps create a calmer, happier you.'});
  const sheetHead=`<div class="sheethead"><button class="sh-grab" data-a="sheetToggle" aria-label="Show the scene"></button><h2>Your habits</h2><div class="sh-right"><span class="sh-left">${S.habits.length?(restDay?'Rest day':left?`${left} left today`:'All done today'):''}</span>
    <button class="tgl" role="switch" aria-checked="${S.showDone}" data-a="toggleDone"><span>Show completed</span><i class="sw"></i></button></div></div>`;
  const head=`<div class="todayhead">${scene}${sheetHead}</div>`;
  if(!S.habits.length)return head+emptyCard();
  const groups=[['daily','Daily'],['weekly','This week'],['monthly','This month']];
  const cardFor=p=>!!S.cycleCard[p]&&cycleReady(p);   // only while it is being celebrated
  const filled=groups.filter(([p])=>todo.some(h=>h.period===p));
  let list='';
  filled.forEach(([p,lab])=>{
    const rowsP=todo.filter(h=>h.period===p);
    if(lab&&filled.length>1)list+=`<div class="sect">${lab}</div>`;else list+=`<div style="height:8px"></div>`;
    if(rowsP.length)list+=`<div class="grp" data-p="${p}">${rowsP.map(rowHTML).join('')}</div>`;
  });
  ['weekly','monthly'].forEach(p=>{if(!cardFor(p)){S.cycleShown[p]=false;if(!cycleReady(p))S.cycleCard[p]=false}});
  const trophies=['weekly','monthly'].filter(cardFor).map(p=>{const c=cycleCard(p,!S.cycleShown[p]);S.cycleShown[p]=true;return c}).join('');   // animate in only the first time
  const showCard=dailyReady(true),freshCard=showCard&&!S.cardShown;S.cardShown=showCard;   // animate only when it first appears
  if(showCard)list=slothParty(freshCard)+list;   // up as soon as the last daily habit is finished; the conga line walks over it later, when the whole list is done
  if(trophies)list=`<div class="trophies">${trophies}</div>`+list;   // the Week / Month complete cards sit right at the top while they last

  if(S.showDone&&doneList.length)list+=`<div class="sect">Completed</div><div class="donegrp">${doneList.map(rowHTML).join('')}</div>`;
  return head+list+`<button class="addbtn" data-a="newHabit">${icon('plus',18,2)} Add habit</button>`+`<div class="tip">${S.habits.length>1?'Press and hold a habit to reorder. ':''}Swipe left to skip. Hold + to type an amount.</div>`;
}

function capFirst(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function legendHTML(h){
  const items=[];
  if(h.period==='daily'&&need(h)<h.goal){
    const full=h.kind==='amount'?`Full goal (${fmt(h.goal)} ${esc(h.unit)})`:'Full';
    items.push(`<span><i class="lg1"></i>Min: ${esc(minLabel(h))}</span>`,`<span><i class="lg2"></i>${full}</span>`);
  }

}
function caption(h){const c=captionBase(h);return hasSkips(h)?c+' Skipped days are left out of your rate and never break a streak.':c}
function captionBase(h){
  const W={daily:'day',weekly:'week',monthly:'month'}[h.period];
  if(h.kind==='amount'&&need(h)<h.goal)return `A day counts from ${fmt(need(h))} ${esc(h.unit)}. Reaching ${fmt(h.goal)} fills the day in fully.`;

function monthView(h){

}
function yearView(h){

function yearStrip(h,y){

/* ---------- Insights ---------- */
function rangeOf(kind,off){
  const t=today();
  if(kind==='week'){const s=addDays(weekStart(t),7*off);return [s,addDays(s,6)]}
  if(kind==='month'){const s=new Date(t.getFullYear(),t.getMonth()+off,1);return [s,monthEnd(s)]}
  if(kind==='year'){const y=t.getFullYear()+off;return [new Date(y,0,1),new Date(y,11,31)]}
  return [earliest(),t];
}
function chartHTML(kind,a,b){
  const t=today();let bars=[],title='Daily completions';
  if(kind==='week'||kind==='month'){
    for(let d=a;d<=b;d=addDays(d,1)){
      const i=bars.length;
      let label='';
      if(kind==='week')label=['M','T','W','T','F','S','S'][i];
      else if([1,5,10,15,20,25].includes(d.getDate()))label=String(d.getDate());
      bars.push({v:d>t?null:checkins(d),label});
    }
  }else{
    title='Monthly completions';
    let s=kind==='year'?new Date(a.getFullYear(),0,1):monthStart(a);const end=kind==='year'?new Date(a.getFullYear(),11,1):monthStart(t);
    while(s<=end){
      let v=null;
      if(s<=t){v=0;const e=monthEnd(s);for(let d=s;d<=e&&d<=t;d=addDays(d,1))v+=checkins(d)}
      const mi='JFMAMJJASOND'[s.getMonth()];
      bars.push({v,label:kind==='year'?mi:(s.getMonth()===0?`'${String(s.getFullYear()).slice(2)}`:(bars.length===0?mi:''))});
      s=new Date(s.getFullYear(),s.getMonth()+1,1);
    }
  }
  const mx=Math.max(1,...bars.map(x=>x.v||0));
  const W=320,H=132,Lm=26,R=4,T=8,B=22,pw=W-Lm-R,ph=H-T-B,n=bars.length,slot=pw/n,bw=Math.max(2,Math.min(14,slot*.62));
  const ticks=[...new Set([0,Math.round(mx/2),mx])];
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${title}">`;
  ticks.forEach(k=>{const y=T+ph*(1-k/mx);svg+=`<line class="gl" x1="${Lm}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${Lm-7}" y="${y+3.5}" text-anchor="end">${k}</text>`});
  bars.forEach((x,i)=>{
    const hh=x.v===null?3:Math.max(3,ph*x.v/mx),px=Lm+slot*i+(slot-bw)/2,fill=x.v===null?'var(--track)':`color-mix(in srgb,var(--g) ${Math.round(30+70*x.v/mx)}%,var(--card))`;
    svg+=`<rect x="${px.toFixed(1)}" y="${(T+ph-hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="${Math.min(3,bw/2)}" style="fill:${fill}"/>`;
    if(x.label)svg+=`<text class="ax" x="${(px+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${x.label}</text>`;
  });
  return `<div class="card chartcard"><h3>${title}</h3>${svg}</svg></div>`;
}
function renderInsights(){
  const head=`<div class="hdr"><div><h1>Insights</h1><div class="sub">Consistency compounds.</div></div>
    <div style="display:flex;gap:10px;align-items:center">${selectPill('','<span>'+({week:'This week',month:'This month',year:'This year',all:'All time'}[S.ins.range])+'</span>','insRange',[['week','This week'],['month','This month'],['year','This year'],['all','All time']],S.ins.range)}
    <button class="iconbtn" data-a="settings" aria-label="Settings">${icon('more',20)}</button></div></div>`;
  if(!S.habits.length)return head+emptyCard();
  const t=today(),kind=S.ins.range,[a,b]=rangeOf(kind,0),cur=dayRuns(a,b),pct=cur.total?cur.good/cur.total:0;
  let delta='';
  if(kind!=='all'){
    const [pa,pb]=rangeOf(kind,-1),pr=dayRuns(pa,pb);
    if(pr.total>0){
      const dp=Math.round(pct*100)-Math.round(pr.good/pr.total*100);
      delta=dp===0?`<span class="delta flat">No change</span>`:`<span class="delta${dp<0?' neg':''}">${dp<0?'\u2193':'\u2191'} ${dp>0?'+':''}${dp}%</span>`;
      delta+=`<span class="vs">vs last ${kind}</span>`;
    }
  }
  const ring=`<div class="card ringcard"><div class="ringwrap">${ringSVG(pct,112,10)}<div class="ringtxt"><b>${Math.round(pct*100)}%</b></div></div>
    <div><div class="big">${cur.good} / ${cur.total} days</div><div class="lab">habits completed</div>${delta}</div></div>`;
  const all=dayRuns(earliest(),t);
  const streaks=`<div class="two"><div class="card tilecard"><span class="ti" style="color:#F26A3D">${icon('flame',30,1.7)}</span><div><b>${all.cur}</b><span>Current streak</span></div></div>
    <div class="card tilecard"><span class="ti" style="color:#E6A100">${icon('trophy',30,1.7)}</span><div><b>${all.best}</b><span>Longest streak</span></div></div></div>`;
  const perf=S.habits.map(h=>{const st=habitStats(h,a,b);return {h,st}});
  const perfHTML=`<div class="card perfcard"><h3>Habit performance</h3>${perf.map(({h,st})=>`<button class="perf" data-a="goHabit" data-id="${h.id}" style="--c:${h.color}"><span class="tile sm">${icon(h.icon,17)}</span><span class="pn">${esc(h.name)}</span><span class="pb"><i style="width:${Math.round(st.rate*100)}%"></i></span><span class="pp">${st.total?Math.round(st.rate*100)+'%':'\u2013'}</span>${icon('chevR',16)}</button>`).join('')}</div>`;
  return head+ring+chartHTML(kind,a,b)+streaks+perfHTML;
}

/* ---------- The habit sheet: swipe up and it slides over the scene and fills the screen ----------
   --p on #app is 0 (the scene shows) to 1 (the sheet fills the screen). The finger moves it; letting go snaps it. */
const SHEET_TRAVEL=262,SHEET_DRAG=262;   // how far the sheet travels, and how far a finger moves it (1:1)
function applyP(p){   // transform and opacity only: the phone moves these without redoing layout or repainting
  const st=$('#stage'),sc=$('#scene');
  if(st&&st.style)st.style.transform=p>0?`translate3d(0,${(-p*SHEET_TRAVEL).toFixed(1)}px,0)`:'';
  if(sc&&sc.style){
    sc.style.transform=p>0?`translate3d(0,${(p*SHEET_TRAVEL*.62).toFixed(1)}px,0)`:'';   // the scene drifts up more slowly: a little depth
    const ui=sc.querySelector?sc.querySelector('.sc-ui'):null;if(ui&&ui.style)ui.style.opacity=p>0?Math.max(0,1-p*1.8).toFixed(2):'';
  }
}
function setSheetAttr(v){const app=$('#app');if(app&&app.getAttribute&&app.getAttribute('data-sheet')!==v)app.setAttribute('data-sheet',v)}
function setP(p,snap){
  const app=$('#app');if(!app||!app.setAttribute)return;
  if(app.classList)app.classList[snap?'add':'remove']('snap');
  applyP(p);
  if(snap){
    setSheetAttr('moving');clearTimeout(setP.t);
    setP.t=setTimeout(()=>{if(app.classList)app.classList.remove('snap');setSheetAttr(S.sheetP>=1?'expanded':'collapsed')},380);
  }else setSheetAttr(p>=1?'expanded':p<=0?'collapsed':'moving');
}
function snapSheet(to){S.sheetP=to;setP(to,true)}
function syncSheet(){   // a redraw keeps the sheet where it was
  if(tch&&tch.mode===2)return;   // never fight a finger that is moving it
  const app=$('#app');if(!app||!app.setAttribute)return;
  const p=S.tab==='today'?S.sheetP:0;
  applyP(p);setSheetAttr(p>=1?'expanded':'collapsed');
}
const sheetOK=()=>S.tab==='today'&&!S.sheet&&!iconPopOpen&&!dragging;
const scrollerOf=el=>{for(let n=el;n&&n.nodeType===1&&n!==document.body;n=n.parentElement){const o=getComputedStyle(n).overflowY;if((o==='auto'||o==='scroll')&&n.scrollHeight>n.clientHeight+1)return n}return null};
let tch=null;
function touchStartSheet(e){
  if(!e.touches||e.touches.length!==1){tch=null;return}
  const t=e.touches[0],tg=e.target;
  tch={y0:t.clientY,x0:t.clientX,ly:t.clientY,lt:performance.now(),v:0,p0:S.sheetP,p:S.sheetP,mode:0,scr:scrollerOf(tg),inSheet:!!(tg.closest&&tg.closest('#head,#screen'))};
}
function touchMoveSheet(e){
  if(!tch||!e.touches||e.touches.length!==1)return;
  const t=e.touches[0],dy=t.clientY-tch.y0,dx=t.clientX-tch.x0,step=t.clientY-tch.ly,now=performance.now();
  tch.v=tch.v*.5+(step/Math.max(1,now-tch.lt))*.5;tch.ly=t.clientY;tch.lt=now;tch.dy=dy;   // smoothed speed, px per ms
  if(tch.mode===0){
    if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){tch.mode=-1;return}   // sideways: that is the swipe-to-skip
    if(Math.abs(dy)<6)return;
    const atTop=!tch.scr||tch.scr.scrollTop<=0;
    tch.mode=(sheetOK()&&tch.inSheet&&((S.sheetP===0&&dy<0)||(S.sheetP===1&&dy>0&&atTop)))?2:1;   // 2 = moving the sheet, 1 = scrolling
  }
  if(tch.mode===2){if(e.cancelable)e.preventDefault();tch.p=clamp(tch.p0-dy/SHEET_DRAG,0,1);setP(tch.p,false);return}
  if(tch.mode===1){
    const sc=tch.scr;
    if(!sc){if(e.cancelable)e.preventDefault();return}   // nothing here scrolls, so the page itself must never move
    const top=sc.scrollTop<=0,bot=sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1;
    if(((top&&step>0)||(bot&&step<0))&&e.cancelable)e.preventDefault();   // at the end of a list: do not hand the swipe on to the page
  }
}
function touchEndSheet(){
  if(!tch)return;const c=tch;tch=null;
  if(c.mode!==2)return;
  snapSheet((Math.abs(c.v)>.3&&Math.abs(c.dy||0)>24)?(c.v<0?1:0):(c.p>=.5?1:0));   // a quick flick wins, otherwise whichever side is nearer
}
